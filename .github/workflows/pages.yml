name: Deploy docs to GitHub Pages

# Renders the AsciiDoc under docs/ to HTML with Asciidoctor and publishes it.
# GitHub Pages' default Jekyll build does NOT render .adoc, so we build here.
#
# One-time setup: repo Settings -> Pages -> Build and deployment ->
#   Source: "GitHub Actions"  (replaces the "/docs folder" source).

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install Asciidoctor
        run: gem install asciidoctor rouge

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate result figures from results.csv (best-effort)
        working-directory: docs/measurement
        run: |
          python -m pip install --quiet matplotlib || true
          python plot_results.py || true

      - name: Render AsciiDoc -> HTML
        run: |
          mkdir -p _site
          # render every .adoc in docs/, preserving relative directories under _site
          find docs -name '*.adoc' -print0 | while IFS= read -r -d '' file; do
            rel="${file#docs/}"
            outdir="_site/$(dirname -- "$rel")"
            mkdir -p "$outdir"
            asciidoctor -a source-highlighter=rouge -a toc=left -D "$outdir" "$file"
          done

          # copy non-adoc assets (images, csv, scripts, md files) into _site
          rsync -a --exclude='*.adoc' docs/ _site/ || true

          # rewrite .adoc links to .html in all generated HTML
          find _site -name '*.html' -exec sed -i -E 's/(href="[^"]*)\.adoc"/\1.html"/g; s/(href="[^"]*)\.adoc#/\1.html#/g' {} +

          # ensure a root index exists: prefer _site/index.html if generated, otherwise redirect to measurement
          if [ ! -f _site/index.html ]; then
            if [ -f _site/measurement/index.html ]; then
              printf '%s\n' '<!doctype html><meta http-equiv="refresh" content="0; url=./measurement/index.html">' > _site/index.html
            else
              printf '%s\n' '<!doctype html><html><body><h1>Documentation</h1><ul>' > _site/index.html
              while IFS= read -r html; do
                rel="${html#_site/}"
                printf '<li><a href="%s">%s</a></li>\n' "$rel" "$rel"
              done < <(find _site -maxdepth 2 -type f -name 'index.html' | sort) >> _site/index.html
              printf '%s\n' '</ul></body></html>' >> _site/index.html
            fi
          fi

      - name: Build Word document (master-rad.docx, best-effort)
        run: |
          sudo apt-get update -y && sudo apt-get install -y pandoc
          chmod +x docs/measurement/build-docx.sh
          # publish the assembled .docx for download from Pages
          docs/measurement/build-docx.sh "$PWD/_site/master-rad.docx" \
            || echo "docx build failed (non-fatal)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
