# thesis.conf — Mosquitto 2.x drop-in za master rad (MQTTS overhead).
#
# Instalacija:
#   sudo cp thesis.conf /etc/mosquitto/conf.d/thesis.conf
# (stock /etc/mosquitto/mosquitto.conf već ima: include_dir /etc/mosquitto/conf.d)
#
# Dva listenera: 1883 plain (esp1_lights + Home Assistant) i 8883 TLS (esp2_temperature).
# Deljena globalna autentikacija na oba porta — NE koristiti per_listener_settings.

# ---- Deljena auth (globalna => važi za oba listenera) ----
password_file /etc/mosquitto/passwd
allow_anonymous false          # Mosquitto 2.x podrazumevano; navedeno eksplicitno za rad

# (opciono) logovanje i perzistencija
persistence true
persistence_location /var/lib/mosquitto/
log_dest file /var/log/mosquitto/mosquitto.log

# ---- Listener 1: PLAIN MQTT ----
#   esp1_lights (BASELINE) i Home Assistant (127.0.0.1)
listener 1883
# nasleđuje globalni password_file / allow_anonymous

# ---- Listener 2: MQTTS / TLS ----
#   esp2_temperature (predmet analize opterećenja)
listener 8883
cafile   /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/server.crt
keyfile  /etc/mosquitto/certs/server.key
tls_version tlsv1.2            # poklapa se sa ESP32 mbedTLS (build ima samo TLS 1.2)
require_certificate false      # server-only (jednosmerni) TLS: ESP32 verifikuje broker; nema klijentskog sertifikata

# NAPOMENA: NE dodavati "per_listener_settings true" — tada password_file/allow_anonymous
# postaju po-listeneru i deljena auth tiho prestane da radi.
