; ESP-IDF project for the 2-board ESP32 Smart Home demo (pure C).
; Each board is its own build environment; shared code lives in
; components/common. The active board is selected for the CMake build via
; board_build.cmake_extra_args (see src/CMakeLists.txt). Select a board:
;
;   pio run -e esp1_lights      -t upload
;   pio run -e esp2_temperature -t upload

[platformio]
default_envs = esp1_lights, esp2_temperature

; ---- shared settings inherited by every board ----
[env]
platform = espressif32
framework = espidf
board = esp32dev
monitor_speed = 115200
upload_speed = 921600

; OTA requires a dual-app partition table on 4 MB flash + rollback.
; See partitions.csv and sdkconfig.defaults.
board_build.partitions = partitions.csv
board_build.flash_size = 4MB
board_upload.flash_size = 4MB

; Base URL for OTA release manifests + binaries hosted on GitHub Releases.
; The firmware fetches <base>/<board>.json to learn the latest version + .bin
; URL. Change the repo slug if you fork this project.
build_flags =
    -DOTA_MANIFEST_URL_BASE=\"https://github.com/grga023/HomeAssistantOrchestration/releases/latest/download\"

[env:esp1_lights]
board_build.cmake_extra_args = -DSMARTHOME_BOARD=esp1_lights

[env:esp2_temperature]
board_build.cmake_extra_args = -DSMARTHOME_BOARD=esp2_temperature
