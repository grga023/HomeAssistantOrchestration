; ESP-IDF project for the 4-board ESP32 Smart Home demo (pure C).
; Each board is its own build environment; shared code lives in
; components/common. The active board is selected for the CMake build via
; board_build.cmake_extra_args (see src/CMakeLists.txt). Select a board:
;
;   pio run -e esp1_lights      -t upload
;   pio run -e esp2_temperature -t upload
;   pio run -e esp3_garage      -t upload
;   pio run -e esp4_security    -t upload

[platformio]
default_envs = esp1_lights, esp2_temperature, esp3_garage, esp4_security

; ---- shared settings inherited by every board ----
[env]
platform = espressif32
framework = espidf
board = esp32dev
monitor_speed = 115200
upload_speed = 921600

[env:esp1_lights]
board_build.cmake_extra_args = -DSMARTHOME_BOARD=esp1_lights

[env:esp2_temperature]
board_build.cmake_extra_args = -DSMARTHOME_BOARD=esp2_temperature

[env:esp3_garage]
board_build.cmake_extra_args = -DSMARTHOME_BOARD=esp3_garage

[env:esp4_security]
board_build.cmake_extra_args = -DSMARTHOME_BOARD=esp4_security
